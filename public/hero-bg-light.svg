<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Fond de hero G3S globe et bouclier</title>
<style>
.gd{animation:gd 10s linear infinite}
.mer{transform-box:fill-box;transform-origin:center;animation:spin 30s ease-in-out infinite}
.m2{animation-delay:-10s}.m3{animation-delay:-20s}
.star{animation:st 6s ease-in-out infinite}
.sh{animation:sp 5s ease-in-out infinite}
@keyframes gd{to{transform:translate(60px,60px)}}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(0.04)}}
@keyframes st{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes sp{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.gd,.mer,.star,.sh{animation:none}.mer{transform:scaleX(.3)}.m2{transform:scaleX(.6)}.m3{transform:scaleX(.9)}}
</style>
<defs>
<pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#264E8C" stroke-width="1" opacity="0.12"/></pattern>
</defs>
<rect class="gd" x="-60" y="-60" width="1720" height="920" fill="url(#grid)"/>
<g transform="translate(800 400)">
<g fill="none" stroke="#264E8C" stroke-width="1.6" opacity="0.5">
<circle r="250"/>
<ellipse class="mer" rx="250" ry="250"/>
<ellipse class="mer m2" rx="250" ry="250"/>
<ellipse class="mer m3" rx="250" ry="250"/>
<path d="M-235.8 -83 Q0 -27 235.8 -83"/>
<path d="M-186.9 -166 Q0 -110 186.9 -166"/>
<path d="M-250 0 Q0 56 250 0"/>
<path d="M-235.8 83 Q0 139 235.8 83"/>
<path d="M-186.9 166 Q0 222 186.9 166"/>
</g>
<g class="star" fill="#264E8C" fill-opacity="0.35" stroke="#264E8C" stroke-width="1.2" stroke-opacity="0.6">
<path d="M0 -340 L16 -262 L0 -274 L-16 -262 Z"/>
<path d="M340 0 L262 16 L274 0 L262 -16 Z"/>
<path d="M0 340 L16 262 L0 274 L-16 262 Z"/>
<path d="M-340 0 L-262 16 L-274 0 L-262 -16 Z"/>
</g>
<g transform="scale(1.05) translate(-500 -191)">
<path d="M500 60 L596 98 V186 C596 250 554 296 500 322 C446 296 404 250 404 186 V98 Z" fill="#F2F6FC" fill-opacity="0.9" stroke="#264E8C" stroke-width="2" stroke-opacity="0.65"/>
<path class="sh" d="M500 92 L568 119 V186 C568 233 538 267 500 286 C462 267 432 233 432 186 V119 Z" fill="none" stroke="#264E8C" stroke-width="1.4"/>
</g>
</g>
</svg>
